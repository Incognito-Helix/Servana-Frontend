version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/" # folder containing package.json (e.g. "/api" if nested)
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/" # always "/" for workflows
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
