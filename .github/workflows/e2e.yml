name: e2e

on:
  pull_request:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      base_url:
        description: "Preview URL to test instead of the local stack (optional)"
        required: false

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BACKEND_URL: http://localhost:8080
      FRONTEND_PORT: 5173
      E2E_BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:5173' }}
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout backend
        if: ${{ !github.event.inputs.base_url }}
        uses: actions/checkout@v4
        with:
          repository: Incognito-Helix/Servana-Backend
          ref: staging
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start backend stack
        if: ${{ !github.event.inputs.base_url }}
        working-directory: backend
        run: |
          [ -f .env.example ] && cp .env.example .env || true
          docker compose up -d --build

      - name: Wait for backend
        if: ${{ !github.event.inputs.base_url }}
        run: |
          for i in $(seq 1 60); do
            curl -fsS "$BACKEND_URL/health" >/dev/null && echo "backend up" && exit 0
            sleep 3
          done
          echo "Backend did not come up"
          (cd backend && docker compose logs) || true
          exit 1

      - name: Build and serve frontend
        if: ${{ !github.event.inputs.base_url }}
        env:
          VITE_API_URL: ${{ env.BACKEND_URL }}
          VITE_USE_MOCKS: "false"
        run: |
          npm run build
          nohup npm run preview -- --port $FRONTEND_PORT --host > frontend.log 2>&1 &
          for i in $(seq 1 40); do
            curl -fsS "$E2E_BASE_URL" >/dev/null && echo "frontend up" && exit 0
            sleep 2
          done
          cat frontend.log
          exit 1

      - name: Run Playwright
        run: npx playwright test

      - name: Upload report and traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Backend logs on failure
        if: failure() && !github.event.inputs.base_url
        run: (cd backend && docker compose logs) || true

      - name: Tear down
        if: always() && !github.event.inputs.base_url
        run: (cd backend && docker compose down -v) || true
